[package]
name = "ai-radio"
version = "1.0.0"
description = "AI Radio App with Edge TTS"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "ai_radio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"json",
	"stream",
] }
# llm = "0.1.0-rc4"  # Removed - complex API, using Python subprocess instead
rand = "0.8"
tokio = { version = "1", features = ["process"] }
futures-util = "0.3"
tauri-plugin-dialog = "2"
