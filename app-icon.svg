  <g font-family="'Courier New', 'Consolas', monospace" text-anchor="middle">
    <text x="512" y="780" font-size="180" font-weight="bold" fill="#00ff41" filter="url(#textGlow)">AI</text>
    <text x="512" y="880" font-size="60" font-weight="normal" fill="#00aa2a">RADIO</text>
