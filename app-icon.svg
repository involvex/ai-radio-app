  <g stroke-linecap="round" fill="none">
    <path d="M 512 512 m -461 0 a 461 461 0 0 1 461 -461" stroke="#00ff41" stroke-opacity="0.15" stroke-width="16"/>
    <path d="M 512 512 m -461 0 a 461 461 0 0 1 922 0" stroke="#00ff41" stroke-opacity="0.12" stroke-width="14"/>
    <path d="M 512 512 m -373 0 a 373 373 0 0 1 373 -373" stroke="#00ff41" stroke-opacity="0.2" stroke-width="14"/>
    <path d="M 512 512 m -285 0 a 285 285 0 0 1 285 -285" stroke="#00ff41" stroke-opacity="0.25" stroke-width="12"/>
    <path d="M 512 512 m -197 0 a 197 197 0 0 1 197 -197" stroke="#00ff41" stroke-opacity="0.3" stroke-width="10"/>

    <path d="M 256 410 a 256 256 0 0 1 512 0" stroke="#00ff41" stroke-opacity="0.4" stroke-width="14"/>
    <path d="M 170 410 a 342 342 0 0 1 684 0" stroke="#00ff41" stroke-opacity="0.3" stroke-width="12"/>
    <path d="M 84 410 a 428 428 0 0 1 856 0" stroke="#00ff41" stroke-opacity="0.2" stroke-width="10"/>
